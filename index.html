                    <div class="flashcard-filter">
                        <button data-flash-filter="vocabulary" class="${filter==='vocabulary'?'active':''}">${L('مفردات', 'Vocab')}</button>
                        <button data-flash-filter="prefixes" class="${filter==='prefixes'?'active':''}">${L('بادئات', 'Prefixes')}</button>
                        <button data-flash-filter="suffixes" class="${filter==='suffixes'?'active':''}">${L('لواحق', 'Suffixes')}</button>
                        <button data-flash-filter="all" class="${filter==='all'?'active':''}">${L('الكل', 'All')}</button>
                    </div>
                    <div style="display:flex;gap:0.4rem;justify-content:center;margin-bottom:0.6rem;flex-wrap:wrap;">
                        <button data-flash-dir="de" class="${dir==='de'?'primary':''}" style="${dir==='de'?'background:var(--brand);color:#fff;':''}border:1px solid var(--border);padding:0.2rem 1rem;border-radius:16px;font-size:0.75rem;">${L(T.ar.cardDirectionDE, T.en.cardDirectionDE)}</button>
                        <button data-flash-dir="meaning" class="${dir==='meaning'?'primary':''}" style="${dir==='meaning'?'background:var(--brand);color:#fff;':''}border:1px solid var(--border);padding:0.2rem 1rem;border-radius:16px;font-size:0.75rem;">${L(T.ar.cardDirectionMeaning, T.en.cardDirectionMeaning)}</button>
                    </div>
                    <div class="flashcard-container ${state.flashFlipped ? 'flipped' : ''}">
                        <div class="flashcard-inner">
                            <div class="flashcard-face front">
                                <div class="big">${german(front)}</div>
                                <div class="sub">${L('اضغط للقلب', 'Tap to flip')}</div>
                            </div>
                            <div class="flashcard-face back">
                                <div class="big">${german(back)}</div>
                                ${item.type === 'vocab' ? `<div class="sub">${L('من', 'from')} ${L('المفردات', 'vocabulary')}</div>` : ''}
                                ${item.type === 'prefix' ? `<div class="sub">${L('بادئة', 'prefix')}</div>` : ''}
                                ${item.type === 'suffix' ? `<div class="sub">${L('لاحقة', 'suffix')}</div>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flashcard-counter">${idx+1} / ${total}</div>
                    <div class="flashcard-controls">
                        <button data-flash-action="prev">◀ ${L(T.ar.prev, T.en.prev)}</button>
                        <button data-flash-action="flip" class="primary">🔄 ${L(T.ar.flip, T.en.flip)}</button>
                        <button data-flash-action="next">${L(T.ar.next, T.en.next)} ▶</button>
                        <button data-flash-action="shuffle">🔀 ${L(T.ar.shuffle, T.en.shuffle)}</button>
                    </div>`;
                return html;
            };

            renderers.practice = function() {
                const mode = state.practiceMode;
                let html = `<h1 class="section-title">🏋️ ${L('تمارين تفاعلية', 'Interactive Practice')}</h1>
                    <p class="section-sub">${L('تدرب على المفردات والقواعد من القصة', 'Practice vocabulary and grammar from the story')}</p>
                    <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1rem;">
                        <button data-practice-mode="sort" class="${mode==='sort'?'active':''}" style="padding:0.3rem 1.2rem;border-radius:20px;border:1px solid var(--border);background:${mode==='sort'?'var(--brand)':'var(--bg-card)'};color:${mode==='sort'?'#fff':'var(--text)'};">${L(T.ar.practiceSort, T.en.practiceSort)}</button>
                        <button data-practice-mode="match" class="${mode==='match'?'active':''}" style="padding:0.3rem 1.2rem;border-radius:20px;border:1px solid var(--border);background:${mode==='match'?'var(--brand)':'var(--bg-card)'};color:${mode==='match'?'#fff':'var(--text)'};">${L(T.ar.practiceMatch, T.en.practiceMatch)}</button>
                        <button data-practice-mode="build" class="${mode==='build'?'active':''}" style="padding:0.3rem 1.2rem;border-radius:20px;border:1px solid var(--border);background:${mode==='build'?'var(--brand)':'var(--bg-card)'};color:${mode==='build'?'#fff':'var(--text)'};">${L(T.ar.practiceBuild, T.en.practiceBuild)}</button>
                    </div>`;

                if (mode === 'sort') {
                    const words = D.vocabulary.slice(0, 8);
                    const shuffled = [...words];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    const articles = ['der', 'die', 'das'];
                    const targets = articles.filter(a => words.some(w => w.article === a));
                    html += `<div style="background:var(--bg-card);border-radius:var(--radius);padding:1rem;border:1px solid var(--border);">
                            <p>${L('اسحب الكلمة إلى المقال المناسب', 'Match each word to its correct article')}</p>
                            <div class="practice-sort">
                                ${shuffled.map(w => `
                                    <div class="word-chip" data-word="${esc(w.de)}" data-article="${esc(w.article)}">${german(w.de)}</div>
                                `).join('')}
                            </div>
                            <div class="practice-targets">
                                ${targets.map(a => `
                                    <div class="target" data-article="${a}" style="border-color:${a==='der'?'var(--der)':a==='die'?'var(--die)':'var(--das)'};">${a}</div>
                                `).join('')}
                            </div>
                            <div class="practice-score" id="practice-score">${L(T.ar.score, T.en.score)}: ${state.practiceScore}</div>
                        </div>`;
                } else if (mode === 'match') {
                    const words = D.vocabulary.slice(0, 6);
                    const shuffled = [...words];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    html += `<div style="background:var(--bg-card);border-radius:var(--radius);padding:1rem;border:1px solid var(--border);">
                            <p>${L('طابق الكلمة الألمانية مع المعنى', 'Match the German word with its meaning')}</p>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                                <div>
                                    <h4>${L('ألماني', 'German')}</h4>
                                    ${shuffled.map(w => `
                                        <div style="padding:0.3rem 0.6rem;border:1px solid var(--border);border-radius:6px;margin-bottom:0.2rem;cursor:pointer;background:var(--bg);">${german(w.de)}</div>
                                    `).join('')}
                                </div>
                                <div>
                                    <h4>${L('المعنى', 'Meaning')}</h4>
                                    ${shuffled.map(w => `
                                        <div style="padding:0.3rem 0.6rem;border:1px solid var(--border);border-radius:6px;margin-bottom:0.2rem;cursor:pointer;background:var(--bg);">${L(w.ar, w.en)}</div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="practice-score" id="practice-score">${L(T.ar.score, T.en.score)}: ${state.practiceScore}</div>
                        </div>`;
                } else {
                    // build mode — use transformations
                    const t = D.transformations[0];
                    html += `<div style="background:var(--bg-card);border-radius:var(--radius);padding:1rem;border:1px solid var(--border);">
                            <p>${L('ابني الكلمة من الأجزاء', 'Build the word from parts')}</p>
                            <div style="font-size:1.2rem;margin:0.4rem 0;">${L('المعنى', 'Meaning')}: ${L(t.ar, t.en)}</div>
                            <div style="display:flex;flex-wrap:wrap;gap:0.4rem;justify-content:center;padding:0.6rem 0;">
                                ${[t.prefix, t.base, t.suffix].filter(Boolean).map(p => `
                                    <div style="padding:0.4rem 1.2rem;border-radius:10px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;font-weight:500;">${german(p)}</div>
                                `).join('')}
                            </div>
                            <div style="text-align:center;font-size:1.1rem;">${L('النتيجة', 'Result')}: ${german(t.result)}</div>
                            <div class="practice-score">${L(T.ar.score, T.en.score)}: ${state.practiceScore}</div>
                        </div>`;
                }
                return html;
            };

            renderers.quiz = function() {
                if (state.quizDone) {
                    const pct = Math.round((state.quizScore / D.quiz.length) * 100);
                    const band = pct >= 80 ? L(T.ar.resultBand1, T.en.resultBand1) :
                        pct >= 50 ? L(T.ar.resultBand2, T.en.resultBand2) :
                        L(T.ar.resultBand3, T.en.resultBand3);
                    return `<h1 class="section-title">🏆 ${L('الاختبار النهائي', 'Final Quiz')}</h1>
                        <div class="quiz-result">
                            <div class="score">${state.quizScore}/${D.quiz.length}</div>
                            <div class="band">${band}</div>
                            <button onclick="state.quizIndex=0;state.quizScore=0;state.quizDone=false;render('quiz');" style="margin-top:1rem;padding:0.5rem 2rem;background:var(--brand);color:#fff;border-radius:20px;">${L('أعد المحاولة', 'Retry')}</button>
                        </div>`;
                }
                const q = D.quiz[state.quizIndex];
                if (!q) return '<p>No quiz questions.</p>';
                const total = D.quiz.length;
                const idx = state.quizIndex;
                const options = q.options || [];
                const isAnswered = document.querySelector('.quiz-options .disabled') !== null;

                let html = `<h1 class="section-title">📝 ${L('الاختبار النهائي', 'Final Quiz')}</h1>
                    <p class="section-sub">${L('اختبر فهمك للقصة', 'Test your understanding of the story')}</p>
                    <div class="quiz-progress">${idx+1} / ${total}</div>
                    <div style="background:var(--bg-card);border-radius:var(--radius);padding:1.2rem;border:1px solid var(--border);">
                        <div style="font-size:1.15rem;font-weight:500;">${L(q.qAr, q.qEn)}</div>
                        <div class="quiz-options">
                            ${options.map((opt, i) => `
                                <button data-quiz-idx="${i}" class="${isAnswered ? 'disabled' : ''}">${esc(opt)}</button>
                            `).join('')}
                        </div>
                        <div id="quiz-explain" style="display:none;" class="quiz-explain"></div>
                        <div style="text-align:right;margin-top:0.6rem;">
                            <button id="quiz-next" style="display:none;padding:0.3rem 1.6rem;background:var(--brand);color:#fff;border-radius:20px;">${L('التالي', 'Next')} →</button>
                        </div>
                    </div>`;
                return html;
            };

            renderers.reference = function() {
                let html = `<h1 class="section-title">📋 ${L('مرجع سريع', 'Quick Reference')}</h1>
                    <p class="section-sub">${L('ملخص القواعد والمفردات الرئيسية', 'Summary of key grammar and vocabulary')}</p>
                    <div style="display:grid;gap:1rem;">
                        <div style="background:var(--bg-card);border-radius:var(--radius);padding:1rem;border:1px solid var(--border);">
                            <h3>${L('المقالات — أنماط موثوقة', 'Articles — Reliable Patterns')}</h3>
                            <div class="ref-grid">
                                <div class="ref-item"><div class="label">der</div><div class="value">-er, -ling (غالباً)</div></div>
                                <div class="ref-item"><div class="label">die</div><div class="value">-heit, -ung, -schaft</div></div>
                                <div class="ref-item"><div class="label">das</div><div class="value">-chen, -lein</div></div>
                            </div>
                        </div>
                        <div style="background:var(--bg-card);border-radius:var(--radius);padding:1rem;border:1px solid var(--border);">
                            <h3>${L('البادئات الرئيسية', 'Key Prefixes')}</h3>
                            <div class="ref-grid">
                                ${D.prefixes.map(p => `
                                    <div class="ref-item"><div class="label">${german(p.affix)}</div><div class="value">${L(p.ar, p.en)} ${p.separable ? '🔀' : '🔗'}</div></div>
                                `).join('')}
                            </div>
                        </div>
                        <div style="background:var(--bg-card);border-radius:var(--radius);padding:1rem;border:1px solid var(--border);">
                            <h3>${L('مصادر موثوقة', 'Reputable Sources')}</h3>
                            <ul style="list-style:none;padding:0;">
                                <li>📚 <a href="https://www.duden.de" target="_blank">Duden</a> — ${L('القاموس الألماني الرسمي', 'Official German dictionary')}</li>
                                <li>📚 <a href="https://www.goethe.de" target="_blank">Goethe-Institut</a> — ${L('مصادر تعلم الألمانية', 'German learning resources')}</li>
                                <li>📚 <a href="https://www.dw.com/deutsch-lernen" target="_blank">Deutsche Welle</a> — ${L('دورات ومحتوى مجاني', 'Free courses and content')}</li>
                            </ul>
                        </div>
                    </div>
                    <div style="margin-top:1rem;text-align:center;font-size:0.8rem;color:var(--text-dim);">
                        ${L('طباعة هذه الصفحة للرجوع إليها', 'Print this page for reference')}
                        <button onclick="window.print()" style="margin-left:0.5rem;padding:0.2rem 1rem;border:1px solid var(--border);border-radius:12px;">🖨️</button>
                    </div>`;
                return html;
            };

            // ---- INIT ----
            function init() {
                setupTopbar();
                // set initial route from hash or home
                const hash = window.location.hash.slice(1);
                const route = hash || 'home';
                // find if route exists
                let found = false;
                D.nav.forEach(g => g.items.forEach(item => { if (item.id === route) found = true; }));
                render(found ? route : 'home');
                // hash change
                window.addEventListener('hashchange', () => {
                    const h = window.location.hash.slice(1);
                    if (h) render(h);
                });
                // populate voices for speech
                if (window.speechSynthesis) {
                    window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
                // expose render for debugging
                window.render = render;
                // update sentence builder after render
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(() => {
                        if (state.route === 'language-builder') updateSentenceDisplay();
                    }, 100);
                });
            }

            // ---- START ----
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // re-bind after each render
            const origRender = render;
            render = function(route) {
                origRender(route);
                // re-bind vocab filters
                document.querySelectorAll('[data-vocab-filter]').forEach(el => {
                    el.onclick = function() {
                        state.vocabFilter = this.dataset.vocabFilter;
                        render(state.route);
                    };
                });
                // re-bind reading mode
                document.querySelectorAll('[data-reading-mode]').forEach(el => {
                    el.onclick = function() {
                        state.readingMode = this.dataset.readingMode;
                        render('reading');
                    };
                });
                // re-bind flash filter/dir already handled in bindDynamicEvents
                // re-bind practice mode
                document.querySelectorAll('[data-practice-mode]').forEach(el => {
                    el.onclick = function() {
                        state.practiceMode = this.dataset.practiceMode;
                        state.practiceSelected = null;
                        state.practiceMatches = [];
                        state.practiceScore = 0;
                        state.practiceRound = 0;
                        render('practice');
                    };
                });
            };

        })();
    </script>

</body>
</html>
