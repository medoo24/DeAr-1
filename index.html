<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutsch Word Builder Lab – The Double Life</title>
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #f8f7f4;
            --bg-card: #ffffff;
            --bg-sidebar: #f0eee8;
            --bg-top: #ffffffcc;
            --text: #1e1e1e;
            --text-dim: #555;
            --border: #d0ccc4;
            --brand: #2c6e49;
            --brand-light: #4c9a6e;
            --der: #2a6b9c;
            --die: #c44a7a;
            --das: #3b8c5e;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.2s ease;
        }
        html[data-theme="dark"] {
            --bg: #171a1c;
            --bg-card: #23272a;
            --bg-sidebar: #1e2124;
            --bg-top: #1e2124cc;
            --text: #e8e6e3;
            --text-dim: #9a9a9a;
            --border: #3a3f44;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            display: flex;
            min-height: 100vh;
            margin: 0;
            line-height: 1.6;
        }
        a {
            color: var(--brand);
            text-decoration: none;
        }
        button {
            font: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            transition: background 0.15s, transform 0.1s;
        }
        button:hover {
            background: var(--border);
        }
        button:active {
            transform: scale(0.97);
        }
        input,
        select {
            font: inherit;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.7rem;
            transition: border 0.15s;
        }
        input:focus,
        select:focus {
            outline: 2px solid var(--brand-light);
            outline-offset: 1px;
        }

        /* ===== SKIP LINK ===== */
        .skip-link {
            position: fixed;
            top: -999px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--brand);
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 0 0 12px 12px;
            z-index: 9999;
            font-weight: 600;
        }
        .skip-link:focus {
            top: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 1rem 0.6rem 2rem;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            transition: background var(--transition), border var(--transition);
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem 1.2rem;
            color: var(--brand);
            letter-spacing: -0.3px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .sidebar-brand small {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.7;
            display: block;
            color: var(--text-dim);
        }
        .sidebar-nav {
            flex: 1;
        }
        .nav-group {
            margin-bottom: 1.2rem;
        }
        .nav-group-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            color: var(--text-dim);
            padding: 0 0.8rem 0.3rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.12s, color 0.12s;
            cursor: pointer;
            color: var(--text-dim);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-item:hover {
            background: var(--border);
            color: var(--text);
        }
        .nav-item.active {
            background: var(--brand);
            color: #fff;
        }
        .nav-item .badge {
            margin-left: auto;
            font-size: 0.6rem;
            background: var(--border);
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            color: var(--text-dim);
        }
        .nav-item.active .badge {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .sidebar-progress {
            margin-top: auto;
            padding: 1rem 0.8rem 0;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .sidebar-progress .bar {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .sidebar-progress .bar-fill {
            height: 100%;
            background: var(--brand);
            border-radius: 4px;
            transition: width 0.4s;
        }
        .reset-btn {
            margin-top: 0.4rem;
            font-size: 0.7rem;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }
        .reset-btn:hover {
            color: var(--text);
        }

        /* ===== MAIN ===== */
        .main-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-top);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            transition: background var(--transition), border var(--transition);
        }
        .topbar .spacer {
            flex: 1;
        }
        .topbar .search-wrap {
            position: relative;
            flex: 0 1 260px;
            min-width: 120px;
        }
        .topbar .search-wrap input {
            width: 100%;
            padding-right: 2.2rem;
        }
        .topbar .search-wrap .clear-search {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-dim);
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            display: none;
        }
        .topbar .search-wrap .clear-search.show {
            display: block;
        }
        .topbar .lang-toggle {
            display: flex;
            gap: 0.2rem;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 0.15rem;
            border: 1px solid var(--border);
        }
        .topbar .lang-toggle button {
            padding: 0.25rem 0.7rem;
            border-radius: 18px;
            font-size: 0.75rem;
            font-weight: 600;
            background: none;
            border: none;
            color: var(--text-dim);
            transition: 0.12s;
        }
        .topbar .lang-toggle button.active {
            background: var(--brand);
            color: #fff;
        }
        .topbar .icon-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.1rem;
            background: none;
            border: 1px solid transparent;
            color: var(--text-dim);
            transition: 0.12s;
        }
        .topbar .icon-btn:hover {
            background: var(--border);
            border-color: var(--border);
        }
        .topbar .icon-btn.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .topbar .stop-speech {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            background: var(--border);
            border-radius: 12px;
            color: var(--text-dim);
        }
        .topbar .stop-speech:hover {
            background: #c44a7a;
            color: #fff;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 1.5rem 2rem 4rem;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .content:focus-visible {
            outline: none;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
        }
        .section-sub {
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .card-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem 1.2rem 1rem;
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition), transform 0.12s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card .article {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            display: inline-block;
            background: var(--border);
            color: var(--text-dim);
        }
        .card .article.der {
            background: var(--der);
            color: #fff;
        }
        .card .article.die {
            background: var(--die);
            color: #fff;
        }
        .card .article.das {
            background: var(--das);
            color: #fff;
        }
        .card .de-word {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0.3rem 0 0.1rem;
        }
        .card .meaning {
            color: var(--text-dim);
            font-size: 0.95rem;
        }
        .card .example {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 0.4rem;
            padding: 0.4rem 0.6rem;
            background: var(--bg);
            border-radius: 6px;
            border-left: 3px solid var(--brand-light);
        }
        .card .plural {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.2rem;
        }
        .card .note {
            font-size: 0.8rem;
            color: var(--text-dim);
            background: var(--bg);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            margin-top: 0.4rem;
            border-left: 3px solid #f0b34b;
        }
        .card .speak-btn {
            float: right;
            font-size: 0.9rem;
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 0.1rem 0.3rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .card .speak-btn:hover {
            background: var(--border);
            color: var(--text);
        }
        .card .speak-btn.playing {
            color: var(--brand);
        }

        /* ===== FLASHCARDS ===== */
        .flashcard-container {
            perspective: 800px;
            margin: 1rem auto;
            max-width: 460px;
            min-height: 220px;
            cursor: pointer;
        }
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 220px;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .flashcard-container.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 220px;
            backface-visibility: hidden;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .flashcard-face.back {
            transform: rotateY(180deg);
        }
        .flashcard-face .big {
            font-size: 2rem;
            font-weight: 700;
        }
        .flashcard-face .sub {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }
        .flashcard-controls {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .flashcard-controls button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .flashcard-controls button:hover {
            background: var(--border);
        }
        .flashcard-controls button.primary {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .flashcard-controls button.primary:hover {
            background: var(--brand-light);
        }
        .flashcard-filter {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .flashcard-filter button {
            padding: 0.2rem 1rem;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--bg-card);
        }
        .flashcard-filter button.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .flashcard-counter {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 0.4rem;
        }

        /* ===== QUIZ ===== */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }
        .quiz-options button {
            text-align: left;
            padding: 0.6rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            font-size: 0.95rem;
            transition: 0.12s;
            width: 100%;
        }
        .quiz-options button:hover:not(.disabled) {
            border-color: var(--brand);
            background: var(--bg);
        }
        .quiz-options button.correct {
            border-color: #2a7a4a;
            background: #2a7a4a22;
        }
        .quiz-options button.wrong {
            border-color: #b13a4a;
            background: #b13a4a22;
        }
        .quiz-options button.disabled {
            cursor: default;
            opacity: 0.8;
        }
        .quiz-explain {
            margin-top: 0.8rem;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: var(--bg);
            border-left: 4px solid var(--brand-light);
            font-size: 0.9rem;
        }
        .quiz-progress {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.6rem;
        }
        .quiz-result {
            text-align: center;
            padding: 2rem 1rem;
        }
        .quiz-result .score {
            font-size: 3rem;
            font-weight: 700;
            color: var(--brand);
        }
        .quiz-result .band {
            font-size: 1.2rem;
            margin-top: 0.4rem;
        }

        /* ===== READING ===== */
        .reading-chunk {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            margin-bottom: 0.5rem;
            transition: 0.12s;
        }
        .reading-chunk:hover {
            border-color: var(--brand-light);
        }
        .reading-chunk .de {
            font-weight: 500;
            font-size: 1.05rem;
        }
        .reading-chunk .trans {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 0.1rem;
        }
        .reading-chunk .speak-btn {
            float: right;
            font-size: 0.8rem;
        }
        .reading-mode-filter {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .reading-mode-filter button {
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg-card);
        }
        .reading-mode-filter button.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .reading-words {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.8rem 0;
        }
        .reading-words .tag {
            background: var(--bg);
            padding: 0.2rem 0.7rem;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .reading-questions {
            margin-top: 1rem;
        }
        .reading-questions li {
            padding: 0.3rem 0;
            list-style: none;
            border-bottom: 1px solid var(--border);
        }
        .reading-questions li::before {
            content: "▸ ";
            color: var(--brand);
        }

        /* ===== DIALOGUE ===== */
        .dialogue-line {
            display: flex;
            gap: 0.6rem;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.2rem;
            align-items: baseline;
        }
        .dialogue-line .speaker {
            font-weight: 700;
            min-width: 2.2rem;
            color: var(--brand);
        }
        .dialogue-line .de {
            font-weight: 500;
        }
        .dialogue-line .trans {
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .dialogue-line .speak-btn {
            font-size: 0.7rem;
            margin-left: 0.3rem;
        }

        /* ===== BUILDER ===== */
        .builder-pieces {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.8rem 0;
            justify-content: center;
        }
        .builder-pieces .piece {
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            font-weight: 500;
            cursor: pointer;
            transition: 0.12s;
            font-size: 1.05rem;
        }
        .builder-pieces .piece:hover {
            border-color: var(--brand-light);
            background: var(--bg);
        }
        .builder-pieces .piece.used {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }
        .builder-pieces .piece.selected {
            border-color: var(--brand);
            background: var(--brand-light);
            color: #fff;
        }
        .builder-result {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0.6rem 0;
            min-height: 2.4rem;
        }
        .builder-check {
            margin-top: 0.4rem;
            text-align: center;
        }
        .builder-check button {
            padding: 0.4rem 1.6rem;
            border-radius: 20px;
            background: var(--brand);
            color: #fff;
            font-weight: 600;
            border: none;
        }
        .builder-check button:hover {
            background: var(--brand-light);
        }

        /* ===== PRACTICE ===== */
        .practice-sort {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.6rem 0;
        }
        .practice-sort .word-chip {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            cursor: pointer;
            font-weight: 500;
            transition: 0.12s;
        }
        .practice-sort .word-chip:hover {
            border-color: var(--brand-light);
        }
        .practice-sort .word-chip.selected {
            border-color: var(--brand);
            background: var(--brand-light);
            color: #fff;
        }
        .practice-sort .word-chip.matched {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }
        .practice-targets {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.4rem 0;
        }
        .practice-targets .target {
            padding: 0.4rem 1.4rem;
            border-radius: 20px;
            border: 2px dashed var(--border);
            min-width: 80px;
            text-align: center;
            font-weight: 600;
            color: var(--text-dim);
            transition: 0.12s;
        }
        .practice-targets .target.highlight {
            border-color: var(--brand-light);
            background: var(--bg);
        }
        .practice-targets .target.filled {
            border-style: solid;
            border-color: var(--brand);
            color: var(--text);
            background: var(--bg-card);
        }
        .practice-targets .target.correct {
            border-color: #2a7a4a;
            background: #2a7a4a22;
        }
        .practice-targets .target.wrong {
            border-color: #b13a4a;
            background: #b13a4a22;
        }
        .practice-score {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 0.6rem;
        }

        /* ===== REFERENCE ===== */
        .ref-grid {
            display: grid;
            gap: 0.8rem;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        .ref-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
        }
        .ref-item .label {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ref-item .value {
            font-size: 1rem;
            margin-top: 0.1rem;
        }

        /* ===== SEARCH OVERLAY ===== */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .search-overlay.open {
            display: flex;
        }
        .search-overlay .panel {
            background: var(--bg-card);
            border-radius: var(--radius);

        D.readingPassages = [{
            titleAr: 'الحياة المزدوجة',
            titleEn: 'The Double Life',
            level: 'A2',
            de: `Mein Name ist Lena. Ich bin fünfunddreißig Jahre alt. Ich bin verheiratet. Mein Mann heißt Paul. Er ist neununddreißig Jahre alt. Paul und ich waren seit acht Jahren verheiratet. Wir hatten keine Kinder. Wir haben es zwei Jahre lang versucht. Wir machten Tests und hatten Termine bei Ärzten. Es ist nicht passiert. Irgendwann haben wir aufgehört, es zu versuchen.

            Wir haben aufgehört, darüber zu sprechen. Wir sagten uns, dass es uns gut geht. Paul ist beruflich viel gereist. Drei Tage die Woche, manchmal vier. Paul sagte, seine Firma brauche ihn. Ich glaubte ihm. Ich vertraute ihm. Wenn man jemanden heiratet, zweifelt man nicht an jedem Satz. Man entspannt sich. Ich dachte, wir bauen etwas Stabiles auf. Ich lag falsch.

            Eines Montagnachmittags machte ich die Wäsche. Pauls Koffer lag halb offen auf dem Bett. Er war gerade von einer Reise zurückgekommen. Ich hob den Koffer auf, um ihn wegzustellen. Eine Karte war in seinem Koffer. Sie rutschte heraus. Ich hätte sie fast ignoriert. Dann sah ich die Vorderseite: „Alles Gute zum Geburtstag, Papa." Ich erstarrte. Wir haben keine Kinder.

            Ich stand lange da. Ich sagte mir, es sei ein Scherz. Vielleicht vom Kind eines Kollegen, vielleicht von einer Nichte. Ich öffnete die Karte. Darin war die Handschrift eines Kindes. Darauf stand: „Wir haben dich so lieb. Danke, dass du zu meiner Theateraufführung in der Schule gekommen bist. In Liebe, Niklas und Lea." Zwei Namen, zwei Kinder, nicht meine, nicht unsere.

            Ich setzte mich auf den Boden, die Karte in meinen Händen und las sie immer wieder. „Danke, dass du zu meiner Theateraufführung gekommen bist." Wann war die Aufführung? Letzte Woche sagte Paul, er sei in Meetings. Ich erinnere mich, weil ich fragte, ob wir zusammen essen könnten. Paul sagte: „Nein, wichtiges Meeting." War an diesem Abend die Theateraufführung? Ich konnte nicht schlafen.

            Paul schlief neben mir. Ich drehte mich zu ihm. Ich versuchte, etwas anderes in seinem Gesicht zu sehen. Schuld, Stress, Angst. Da war nichts. Nur der Mann, den ich geheiratet habe. Ich lag wach, sah ihm beim Schlafen zu und fragte mich, wer er war. Am nächsten Morgen war die Karte weg. Ich überprüfte den Koffer noch einmal. Ich kontrollierte jede Tasche, jeden Reißverschluss. Leer. Paul hatte sie versteckt, während ich unter der Dusche war.

            Das bedeutete, er wusste es. Er wusste, dass ich vielleicht nachsehen würde. Er wusste, dass er vorsichtig sein musste. Ich habe ihn nicht zur Rede gestellt. Noch nicht. Stattdessen suchte ich die Namen im Internet. Niklas, Lea. Tausende von Ergebnissen. Dann suchte ich mit seinem Nachnamen: Niklas Wagner, Lea Wagner. Und ich sah es. Ein Familienfoto, das vor drei Monaten auf Facebook gepostet wurde. Paul stand neben einer Frau, zwei Kinder vor ihnen. Ein Junge, vielleicht sieben, ein Mädchen vielleicht fünf. Mein Herz blieb stehen.

            Ich vergrößerte das Bild. Die gleiche Uhr, die Paul trägt, die gleichen Schuhe, die gleiche Jacke, die ich ihm zu Weihnachten gekauft habe. Der Name der Frau war Clara. Ihr Profil war öffentlich. Verheiratet, zwei Kinder, Wohnort zwei Stunden von unserem Haus entfernt. Acht Jahre verheiratet. Acht Jahre, genau wie wir.

            Ich scrollte durch ihre Fotos. Geburtstagsfeiern, Schulveranstaltungen, Festessen. Paul lächelte, hielt die Kinder im Arm, küsste ihre Stirn. Genau so, wie er meine küsste. Ich rief die Nummer an, die auf ihrem Profil stand. Ich sagte: „Hallo, ist dort Clara?" Sie sagte: „Ja, am Apparat." Ich sagte: „Mein Name ist Lena. Ich glaube, wir sind mit demselben Mann verheiratet." Stille. Dann lachte Clara. Nicht, weil es lustig war, sondern weil es unmöglich war.

            Sie sagte: „Sie müssen sich irren." Ich sagte: „Mein Mann heißt Paul Wagner. Er verreist beruflich." Clara sagte: „Meiner auch." Ihre Stimme zitterte. Ich sagte: „Kommt er freitags nach Hause?" Sie sagte: „Ja." Meine Beine fühlten sich schwach an. Ich sagte: „Fährt er am Montagmorgen weg? Manchmal auch am Sonntagabend? Er verbringt Dienstag bis Donnerstag bei Ihnen." Clara erstarrte. Sie sagte: „Oh mein Gott!" Am nächsten Tag trafen wir uns in einem Café. Ich holte mein Handy heraus und zeigte ihr Hochzeitsfotos. Clara tat dasselbe. Andere Kirche, dasselbe Jahr. Paul hat sie zuerst geheiratet, zehn Monate vor mir.

            Er hat mich geheiratet in dem Wissen, dass er bereits Ehemann und bereits Vater war. Ich konnte es nicht glauben. Clara fragte: „Wie lange schon?" Ich sagte: „Acht Jahre." Ihre Augen füllten sich mit Tränen. Clara erzählte mir, wie sie sich auf einer Wohltätigkeitsveranstaltung kennengelernt haben. Paul war nett und lustig. Clara sagte, er habe hart gearbeitet. Paul verpasste einige Schulveranstaltungen, aber er entschuldigte sich immer. Er brachte immer Geschenke mit.

            Ich erinnerte mich an die Geschenke, die Paul mir von seinen Geschäftsreisen mitbrachte. Ich fühlte mich verletzt. Wir beschlossen, ihn gemeinsam zur Rede zu stellen. Wir warteten in meinem Haus. Paul kam um neunzehn Uhr nach Hause. Er trug seinen Koffer. Paul blieb stehen, als er Clara sah. Sein Gesicht wurde kreideweiß. Sein Blick wanderte von Clara zu mir. Sein Mund öffnete sich, aber es kamen keine Worte heraus.

            Ich sagte: „Willst du das erklären?" Paul sah Clara, dann mich. Er sagte: „Ich kann das erklären." Clara sagte: „Nein, fang mit dem Warum an." Paul setzte sich auf das Sofa. Er sagte: „Ich habe das nicht geplant." Ich sagte: „Du hast zwei Frauen geheiratet. Das erfordert Planung." Paul sagte: „Ich habe euch beide geliebt." Clara fragte: „Hast du uns beide angelogen?" Er antwortete: „Ja." Ich war wütend. Ich sagte: „Wie? Wie hast du das geschafft?" Paul sagte, er arbeite in verschiedenen Städten.

            Er mietete zwei Wohnungen, eine in der Nähe von jedem Haus und erzählte jeder von uns, dass er dort wegen der Arbeit bleibe. Vorsichtige Lügen, getrennte Bankkonten, getrennte Kreditkarten. Er sagte, es sei mit der Zeit einfacher geworden. Ich fragte: „Welche Familie war echt?" Paul schaute auf den Boden. Er sagte: „Beide." Mein Herz brach.

            Ich dachte an unsere Abendessen, unsere Reisen, die Nächte, in denen er mich hielt und sagte: „Du bist meine ganze Welt." Jetzt weiß ich, dass ich nur die halbe Welt war. Clara fing an zu weinen. Sie sagte: „Was ist mit den Kindern?" Paul sagte: „Sie wissen es nicht. Bitte sagt es ihnen nicht." Da veränderte sich etwas in mir.

            Es ging nicht mehr um Liebe oder Schmerz. Es ging um den Charakter. Darum, was für ein Mann seine Kinder ansehen und eine Lüge leben kann, der ihnen einen Gutenachtkuss geben und zu einer anderen Ehefrau fahren kann. Ich verließ den Raum. Ich brauchte Luft. Paul folgte mir nach draußen. Er sagte: „Lena, bitte hör mir zu." Ich drehte mich nicht um. Ich fragte: „Wie oft hast du mich geküsst, nachdem du sie geküsst hast?" Paul sagte nichts. Das war meine Antwort.

            Der Scheidungsprozess war lang und chaotisch. Anwälte stellten Fragen, die ich nicht beantworten wollte. Familie, die sagte: „Wir dachten immer, dass etwas nicht stimmt, haben aber nie etwas gesagt." Die Kinder fanden es heraus. Clara sagte ihnen die Wahrheit. Sie saß mit ihnen auf einer Bank. Niklas weinte. Lea hielt ihre Hand. Clara war stark, stärker als ich dachte. Niklas fragte: „Heißt das, Papa liebt uns nicht?" Ich konnte Claras Antwort nicht hören, aber diese Frage blieb mir im Gedächtnis, weil ich mich dasselbe fragte: Hat Paul uns geliebt oder liebte er das Gefühl, zwei Zuhause zu haben, in die er flüchten konnte?

            Monate vergingen. Die Wut kühlte ab. Ich verstand etwas. Er hat nicht zwei Familien gegründet, weil er uns liebte. Er hat zwei Familien gegründet, weil er Angst hatte, allein zu sein. Also wählte er beide und verlor beide. Ich hasse Clara nicht. Wir sprechen manchmal miteinander, nicht als Freundinnen, sondern als zwei Frauen, die dieselbe Lüge gelebt haben.

            Wir erinnern uns gegenseitig daran, dass wir nicht dumm waren, sondern vertrauensvoll. Früher dachte ich, Verrat sei laut und dramatisch. Ist er nicht. Manchmal ist er leise, organisiert. Manchmal sieht Verrat aus wie ein Mann, der lächelnd nach Hause kommt, deine Stirn küsst und fragt, was es zum Abendessen gibt. Ich war acht Jahre lang verheiratet, aber ich war nicht die einzige Ehefrau. Er hatte eine andere Familie und ihn zu verlieren, hat mich nicht gebrochen, denn Liebe zeigt sich nicht darin, wie oft jemand nach Hause kommt. Sie zeigt sich darin, ob er jemals weggegangen ist – und er war von Anfang an nie ganz da.`,
            ar: `اسمي لينا. عمري خمسة وثلاثون عاماً. أنا متزوجة. زوجي يدعى بول. عمره تسعة وثلاثون عاماً. كنا متزوجين منذ ثماني سنوات. لم يكن لدينا أطفال. حاولنا لمدة عامين. أجرينا فحوصات ومواعيد عند الأطباء. لم يحدث شيء. في مرحلة ما توقفنا عن المحاولة.

            توقفنا عن التحدث عن ذلك. قلنا لأنفسنا أننا بخير. سافر بول كثيراً لأسباب عمل. ثلاثة أيام في الأسبوع، وأحياناً أربعة. قال بول إن شركته بحاجة إليه. صدقته. وثقت به. عندما تتزوج شخصاً، لا تشك في كل جملة. تسترخي. اعتقدت أننا نبني شيئاً مستقراً. كنت مخطئة.

            في أحد بعد ظهر يوم الاثنين، كنت أغسل الملابس. كانت حقيبة بول نصف مفتوحة على السرير. كان قد عاد لتوه من رحلة. رفعت الحقيبة لأضعها جانباً. كانت بطاقة في حقيبته. انزلقت للخارج. كنت لأكاد أتجاهلها. ثم رأيت الوجه الأمامي: "كل عام وأنت بخير يا أبي." تجمدت. ليس لدينا أطفال.

            وقفت طويلاً هناك. قلت لنفسي إنها مزحة. ربما من طفل زميل، ربما من ابنة أخت. فتحت البطاقة. كان فيها خط يد طفل. مكتوب عليها: "نحن نحبك كثيراً. شكراً لحضورك عرضي المسرحي في المدرسة. مع الحب، نيكلاس وليا." اسمان، طفلان، ليسا لي، ليسا لنا.

            جلست على الأرض، البطاقة في يدي، وقرأتها مراراً وتكراراً. "شكراً لحضورك عرضي المسرحي." متى كان العرض؟ الأسبوع الماضي قال بول إنه في اجتماعات. أتذكر لأنني سألت إذا كان بإمكاننا تناول العشاء معاً. قال بول: "لا، اجتماع مهم." هل كان العرض المسرحي في ذلك المساء؟ لم أستطع النوم.

            نام بول بجانبي. التفت نحوه. حاولت رؤية شيء آخر في وجهه. الذنب، التوتر، الخوف. لم يكن هناك شيء. فقط الرجل الذي تزوجته. بقيت مستيقظة، أنظر إليه وهو نائم وأتساءل من هو. في الصباح التالي اختفت البطاقة. تفقدت الحقيبة مرة أخرى. فحصت كل جيب، كل سحاب. فارغة. كان بول قد أخفاها بينما كنت تحت الدش.

            هذا يعني أنه كان يعلم. كان يعلم أنني قد أتفقد. كان يعلم أنه يجب أن يكون حذراً. لم أواجهه. ليس بعد. بدلاً من ذلك، بحثت عن الأسماء على الإنترنت. نيكلاس، ليا. آلاف النتائج. ثم بحثت باسم عائلته: نيكلاس فاغنر، ليا فاغنر. ورأيتها. صورة عائلية نُشرت على فيسبوك قبل ثلاثة أشهر. بول يقف بجانب امرأة، طفلان أمامهم. صبي، ربما في السابعة، فتاة ربما في الخامسة. توقف قلبي.

            كبرت الصورة. نفس الساعة التي يرتديها بول، نفس الحذاء، نفس السترة التي اشتريتها له في عيد الميلاد. اسم المرأة كان كلارا. ملفها الشخصي عام. متزوجة، طفلان، مكان السكن على بعد ساعتين من منزلنا. متزوجة منذ ثماني سنوات. ثماني سنوات، مثلنا تماماً.

            تمررت عبر صورها. احتفالات أعياد ميلاد، فعاليات مدرسية، وجبات عشاء. بول يبتسم، يحمل الأطفال بين ذراعيه، يقبل جبينهم. تماماً كما يقبل جبيني. اتصلت بالرقم الموجود في ملفها. قلت: "مرحباً، هل كلارا موجودة؟" قالت: "نعم، أنا المتحدثة." قلت: "اسمي لينا. أعتقد أننا متزوجتان من نفس الرجل." صمت. ثم ضحكت كلارا. ليس لأن الأمر مضحك، بل لأنه مستحيل.

            قالت: "لا بد أنك مخطئة." قلت: "زوجي يدعى بول فاغنر. يسافر لأسباب عمل." قالت كلارا: "زوجي أيضاً." كان صوتها يرتجف. قلت: "هل يعود إلى المنزل أيام الجمعة؟" قالت: "نعم." شعرت بساقيّ تضعفان. قلت: "هل يغادر صباح الاثنين؟ وأحياناً مساء الأحد؟ يقضي من الثلاثاء إلى الخميس عندك." تجمدت كلارا. قالت: "يا إلهي!" في اليوم التالي التقينا في مقهى. أخرجت هاتفي وأريتها صور الزفاف. فعلت كلارا الشيء نفسه. كنيسة مختلفة، نفس العام. تزوجها بول أولاً، قبل عشرة أشهر مني.

            تزوجني وهو يعلم أنه بالفعل زوج وأب. لم أستطع تصديق ذلك. سألت كلارا: "منذ متى؟" قلت: "ثماني سنوات." امتلأت عيناها بالدموع. أخبرتني كلارا كيف التقيا في حفل خيري. كان بول لطيفاً ومضحكاً. قالت كلارا إنه يعمل بجد. كان بول يفوت بعض الفعاليات المدرسية، لكنه كان يعتذر دائماً. كان يحضر الهدايا دائماً معه.

            تذكرت الهدايا التي كان بول يحضرها لي من رحلات العمل. شعرت بالجرح. قررنا مواجهته معاً. انتظرنا في منزلي. جاء بول الساعة السابعة مساءً. كان يحمل حقيبته. توقف بول عندما رأى كلارا. أصبح وجهه شاحباً كالطباشير. انتقل نظره من كلارا إليّ. فتح فمه لكن لم تخرج كلمات.

            قلت: "هل تريد أن تشرح هذا؟" نظر بول إلى كلارا، ثم إليّ. قال: "يمكنني أن أشرح ذلك." قالت كلارا: "لا، ابدأ بلماذا." جلس بول على الأريكة. قال: "لم أخطط لذلك." قلت: "لقد تزوجت امرأتين. هذا يتطلب تخطيطاً." قال بول: "لقد أحببتكما كليكما." سألت كلارا: "هل كذبت علينا كليتنا؟" أجاب: "نعم." كنت غاضبة. قلت: "كيف؟ كيف فعلت ذلك؟" قال بول إنه يعمل في مدن مختلفة.

            استأجر شقتين، واحدة بالقرب من كل منزل، وأخبر كل منا أنه يبقى هناك بسبب العمل. أكاذيب حذرة، حسابات بنكية منفصلة، بطاقات ائتمان منفصلة. قال إن الأمر أصبح أسهل مع مرور الوقت. سألت: "أي عائلة كانت حقيقية؟" نظر بول إلى الأرض. قال: "كلتاهما." انكسر قلبي.

            فكرت في عشاءنا، رحلاتنا، الليالي التي كان يحتضنني فيها ويقول: "أنت عالمي كله." الآن أعرف أنني كنت نصف العالم فقط. بدأت كلارا تبكي. قالت: "وماذا عن الأطفال؟" قال بول: "لا يعرفون. من فضلك لا تخبريهم." عندها تغير شيء في داخلي.

            لم يعد الأمر يتعلق بالحب أو الألم. بل بالشخصية. بما يمكن لرجل أن ينظر في عيون أطفاله ويعيش كذبة، أن يقبلهم قبلة تصبح على خير ويذهب إلى زوجة أخرى. غادرت الغرفة. كنت بحاجة إلى هواء. تبعني بول إلى الخارج. قال: "لينا، من فضلك استمعي إلي." لم ألتفت. سألت: "كم مرة قبلتني بعد أن قبلتها؟" لم يقل بول شيئاً. كان ذلك جوابي.

            كانت عملية الطلاق طويلة وفوضوية. طرح المحامون أسئلة لم أرغب في الإجابة عليها. عائلة قالت: "كنا نعتقد دائماً أن هناك شيئاً خاطئاً، لكننا لم نقل شيئاً أبداً." اكتشف الأطفال الأمر. أخبرتهم كلارا بالحقيقة. جلست معهم على مقعد. بكى نيكلاس. أمسكت ليا بيدها. كانت كلارا قوية، أقوى مما ظننت. سأل نيكلاس: "هل يعني ذلك أن أبي لا يحبنا؟" لم أستطع سماع رد كلارا، لكن هذا السؤال بقي في ذاكرتي، لأنني سألت نفسي: هل أحبنا بول أم أنه أحب الشعور بوجود منزلين يهرب إليهما؟

            مرت الأشهر. برد الغضب. أدركت شيئاً. لم يؤسس عائلتين لأنه أحبنا. أسس عائلتين لأنه كان خائفاً من أن يكون وحيداً. لذا اختار كلتيهما وفقدهما. لا أكره كلارا. نتحدث أحياناً، ليس كصديقات، بل كامرأتين عاشتا نفس الكذبة.

            نذكر بعضنا البعض بأننا لم نكن أغبياء، بل واثقين. كنت أظن أن الخيانة صاخبة ودرامية. ليست كذلك. أحياناً تكون هادئة ومنظمة. أحياناً تبدو الخيانة كرجل يعود إلى المنزل مبتسماً، يقبل جبينك ويسأل ماذا هناك للعشاء. كنت متزوجة ثماني سنوات، لكنني لم أكن الزوجة الوحيدة. كان لديه عائلة أخرى، وفقدانه لم يحطمني، لأن الحب لا يظهر في عدد مرات عودة شخص إلى المنزل. بل يظهر في ما إذا كان قد غادر على الإطلاق – وهو لم يكن موجوداً بالكامل منذ البداية.`,
            en: `My name is Lena. I am thirty-five years old. I am married. My husband is Paul. He is thirty-nine years old. Paul and I had been married for eight years. We had no children. We tried for two years. We took tests and had appointments with doctors. It didn't happen. At some point we stopped trying.

            We stopped talking about it. We told ourselves we were fine. Paul traveled a lot for work. Three days a week, sometimes four. Paul said his company needed him. I believed him. I trusted him. When you marry someone, you don't doubt every sentence. You relax. I thought we were building something stable. I was wrong.

            One Monday afternoon I was doing laundry. Paul's suitcase was half open on the bed. He had just returned from a trip. I picked up the suitcase to put it away. A card was in his suitcase. It slipped out. I almost ignored it. Then I saw the front: "Happy birthday, Dad." I froze. We have no children.

            I stood there for a long time. I told myself it was a joke. Maybe from a colleague's child, maybe from a niece. I opened the card. Inside was a child's handwriting. It said: "We love you so much. Thank you for coming to my school play. With love, Niklas and Lea." Two names, two children, not mine, not ours.

            I sat on the floor, the card in my hands, and read it again and again. "Thank you for coming to my school play." When was the play? Last week Paul said he was in meetings. I remember because I asked if we could have dinner together. Paul said: "No, important meeting." Was the play that evening? I couldn't sleep.

            Paul slept next to me. I turned to him. I tried to see something else in his face. Guilt, stress, fear. There was nothing. Just the man I married. I lay awake, watching him sleep, wondering who he was. The next morning the card was gone. I checked the suitcase again. I checked every pocket, every zipper. Empty. Paul had hidden it while I was in the shower.

            That meant he knew. He knew I might check. He knew he had to be careful. I didn't confront him. Not yet. Instead, I searched the names online. Niklas, Lea. Thousands of results. Then I searched with his surname: Niklas Wagner, Lea Wagner. And I saw it. A family photo posted on Facebook three months ago. Paul stood next to a woman, two children in front of them. A boy, maybe seven, a girl maybe five. My heart stopped.

            I enlarged the image. The same watch Paul wears, the same shoes, the same jacket I bought him for Christmas. The woman's name was Clara. Her profile was public. Married, two children, residence two hours from our house. Married eight years. Eight years, just like us.

            I scrolled through her photos. Birthday parties, school events, dinners. Paul smiling, holding the children in his arms, kissing their foreheads. Just like he kissed mine. I called the number on her profile. I said: "Hello, is that Clara?" She said: "Yes, speaking." I said: "My name is Lena. I believe we are married to the same man." Silence. Then Clara laughed. Not because it was funny, but because it was impossible.

            She said: "You must be mistaken." I said: "My husband is Paul Wagner. He travels for work." Clara said: "Mine too." Her voice trembled. I said: "Does he come home on Fridays?" She said: "Yes." My legs felt weak. I said: "Does he leave on Monday mornings? Sometimes on Sunday evenings? He spends Tuesday through Thursday with you." Clara froze. She said: "Oh my God!" The next day we met in a café. I took out my phone and showed her wedding photos. Clara did the same. Different church, same year. Paul married her first, ten months before me.

            He married me knowing he was already a husband and already a father. I couldn't believe it. Clara asked: "How long?" I said: "Eight years." Her eyes filled with tears. Clara told me how they met at a charity event. Paul was nice and funny. Clara said he worked hard. Paul missed some school events, but he always apologized. He always brought gifts.

            I remembered the gifts Paul brought me from his business trips. I felt hurt. We decided to confront him together. We waited at my house. Paul came home at seven o'clock. He carried his suitcase. Paul stopped when he saw Clara. His face turned chalk-white. His gaze moved from Clara to me. His mouth opened but no words came out.

            I said: "Do you want to explain this?" Paul looked at Clara, then at me. He said: "I can explain that." Clara said: "No, start with why." Paul sat on the sofa. He said: "I didn't plan this." I said: "You married two women. That requires planning." Paul said: "I loved you both." Clara asked: "Did you lie to both of us?" He answered: "Yes." I was angry. I said: "How? How did you do it?" Paul said he worked in different cities.

            He rented two apartments, one near each house, and told each of us he stayed there because of work. Careful lies, separate bank accounts, separate credit cards. He said it became easier over time. I asked: "Which family was real?" Paul looked at the floor. He said: "Both." My heart broke.

            I thought about our dinners, our trips, the nights he held me and said: "You are my whole world." Now I know I was only half the world. Clara started crying. She said: "What about the children?" Paul said: "They don't know. Please don't tell them." Something changed in me.

            It was no longer about love or pain. It was about character. About what kind of man can look at his children and live a lie, kiss them goodnight and drive to another wife. I left the room. I needed air. Paul followed me outside. He said: "Lena, please listen to me." I didn't turn around. I asked: "How many times did you kiss me after kissing her?" Paul said nothing. That was my answer.

            The divorce process was long and chaotic. Lawyers asked questions I didn't want to answer. Family who said: "We always thought something was wrong, but we never said anything." The children found out. Clara told them the truth. She sat with them on a bench. Niklas cried. Lea held her hand. Clara was strong, stronger than I thought. Niklas asked: "Does that mean Dad doesn't love us?" I couldn't hear Clara's answer, but that question stayed with me, because I asked myself the same: Did Paul love us, or did he love the feeling of having two homes to escape to?

            Months passed. The anger cooled. I understood something. He didn't start two families because he loved us. He started two families because he was afraid to be alone. So he chose both and lost both. I don't hate Clara. We talk sometimes, not as friends, but as two women who lived the same lie.

            We remind each other that we weren't stupid, but trusting. I used to think betrayal was loud and dramatic. It's not. Sometimes it's quiet, organized. Sometimes betrayal looks like a man coming home smiling, kissing your forehead and asking what's for dinner. I was married for eight years, but I wasn't the only wife. He had another family, and losing him didn't break me, because love isn't shown in how often someone comes home. It's shown in whether they ever left – and he was never fully there from the start.`,

                theme: localStorage.getItem('dwbl-theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches ?
                    'dark' : 'light'),
                focus: localStorage.getItem('dwbl-focus') === 'true',
                speech: { active: null, playing: false, utterance: null },
                search: { query: '', results: [], open: false },
                // section-specific
                vocabFilter: 'all',
                flashFilter: 'vocabulary',
                flashIndex: 0,
                flashFlipped: false,
                flashDirection: 'de',
                flashShuffled: [],
                flashShuffledIndex: 0,
                flashItems: [],
                quizIndex: 0,
                quizAnswered: false,
                quizScore: 0,
                quizDone: false,
                practiceMode: 'sort',
                practiceSelected: null,
                practiceMatches: [],
                practiceScore: 0,
                practiceRound: 0,
                builderPieces: [],
                builderSelected: [],
                builderDone: false,
                readingMode: 'small',
                readingIndex: 0,
                sentenceSubject: 's1',
                sentenceVerb: 'v1',
                sentenceTime: 't1',
                sentenceResult: '',
            };

            const store = {
                get: (k) => localStorage.getItem('dwbl-' + k),
                set: (k, v) => localStorage.setItem('dwbl-' + k, v),
            };

            // ---- RENDERERS ----
            const renderers = {};

            // ---- NAV ----
            function buildNav() {
                const nav = document.getElementById('sidebar-nav');
                let html = '';
                D.nav.forEach(g => {
                    const gTitle = L(g.groupAr, g.groupEn);
                    html += `<div class="nav-group"><div class="nav-group-title">${esc(gTitle)}</div>`;
                    g.items.forEach(item => {
                        const active = state.route === item.id ? 'active' : '';
                        const visited = state.visited.includes(item.id) ? ' ✓' : '';
                        html += `<button class="nav-item ${active}" data-route="${item.id}" aria-current="${state.route === item.id ? 'page' : 'false'}">
                                <span>${esc(L(item.ar, item.en))}</span>
                                <span class="badge">${visited}</span>
                            </button>`;
                    });
                    html += '</div>';
                });
                nav.innerHTML = html;
                updateProgress();
            }

            function updateProgress() {
                const total = D.nav.reduce((acc, g) => acc + g.items.length, 0);
                const done = state.visited.length;
                document.getElementById('progress-text').textContent = `${done} / ${total}`;
                document.getElementById('progress-fill').style.width = `${(done/total)*100}%`;
            }

            // ---- TOP BAR ----
            function setupTopbar() {
                // Language
                document.querySelectorAll('.lang-toggle button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === state.lang);
                    btn.onclick = () => {
                        state.lang = btn.dataset.lang;
                        store.set('lang', state.lang);
                        document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
                        document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active',
                        b === btn));
                        render(state.route);
                    };
                });
                document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';

                // Theme
                document.getElementById('theme-toggle').onclick = () => {
                    state.theme = state.theme === 'dark' ? 'light' : 'dark';
                    store.set('theme', state.theme);
                    document.documentElement.dataset.theme = state.theme;
                    render(state.route);
                };
                document.documentElement.dataset.theme = state.theme;

                // Focus
                document.getElementById('focus-toggle').onclick = () => {
                    state.focus = !state.focus;
                    store.set('focus', String(state.focus));
                    document.body.classList.toggle('focus-mode', state.focus);
                    render(state.route);
                };
                document.body.classList.toggle('focus-mode', state.focus);

                // Stop speech
                document.getElementById('stop-speech').onclick = () => {
                    window.speechSynthesis && window.speechSynthesis.cancel();
                    state.speech.playing = false;
                    state.speech.active = null;
                };

                // Shortcuts toggle
                document.getElementById('shortcuts-toggle').onclick = () => {
                    document.getElementById('shortcuts-help').classList.toggle('open');
                };
                document.querySelector('.close-shortcuts').onclick = () => {
                    document.getElementById('shortcuts-help').classList.remove('open');
                };

                // Search overlay
                const overlay = document.getElementById('search-overlay');
                document.getElementById('global-search').onclick = () => {
                    overlay.classList.add('open');
                    document.getElementById('search-input').focus();
                };
                document.getElementById('close-search-overlay').onclick = () => {
                    overlay.classList.remove('open');
                };
                overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };
                document.getElementById('search-input').oninput = (e) => {
                    const q = e.target.value.toLowerCase().trim();
                    const results = document.getElementById('search-results');
                    if (!q) { results.innerHTML = ''; return; }
                    const items = searchIndex(q);
                    results.innerHTML = items.length ? items.map(item =>
                        `<div class="result-item" data-route="${item.route}">
                                <div class="match">${esc(item.label)}</div>
                                <div class="ctx">${esc(item.context || '')}</div>
                            </div>`
                    ).join('') : `<div>${L(T.ar.noResults, T.en.noResults)}</div>`;
                    results.querySelectorAll('.result-item').forEach(el => {
                        el.onclick = () => {
                            overlay.classList.remove('open');
                            render(el.dataset.route);
                        };
                    });
                };
                document.getElementById('clear-search').onclick = () => {
                    document.getElementById('global-search').value = '';
                    document.getElementById('search-results').innerHTML = '';
                    document.getElementById('clear-search').classList.remove('show');
                };
                document.getElementById('global-search').oninput = (e) => {
                    document.getElementById('clear-search').classList.toggle('show', e.target.value.length > 0);
                };

                // Menu toggle for mobile
                const menuToggle = document.getElementById('menu-toggle');
                const sidebar = document.querySelector('.sidebar');
                menuToggle.style.display = window.innerWidth < 820 ? 'block' : 'none';
                menuToggle.onclick = () => {
                    sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
                };
                window.addEventListener('resize', () => {
                    menuToggle.style.display = window.innerWidth < 820 ? 'block' : 'none';
                    if (window.innerWidth >= 820) sidebar.style.display = 'block';
                });
            }

            // ---- SEARCH INDEX ----
            function searchIndex(q) {
                const results = [];
                const add = (label, context, route) => {
                    if (label.toLowerCase().includes(q) || (context && context.toLowerCase().includes(q))) {
                        results.push({ label, context, route });
                    }
                };
                D.vocabulary.forEach(v => {
                    add(v.de, v.en + ' ' + v.ar, 'vocabulary');
                    add(v.article + ' ' + v.de, v.example || '', 'vocabulary');
                });
                D.prefixes.forEach(p => {
                    add(p.affix, p.en + ' ' + p.ar, 'prefixes');
                });
                D.suffixes.forEach(s => {
                    add(s.affix, s.en + ' ' + s.ar, 'suffixes');
                });
                D.dialogues.forEach(d => {
                    add(L(d.titleAr, d.titleEn), '', 'dialogues');
                });
                D.readingPassages.forEach(r => {
                    add(L(r.titleAr, r.titleEn), '', 'reading');
                });
                D.everydaySentences.forEach(s => {
                    add(s.de, s.en + ' ' + s.ar, 'sentences');
                });
                // nav items
                D.nav.forEach(g => {
                    g.items.forEach(item => {
                        add(L(item.ar, item.en), '', item.id);
                    });
                });
                return results.slice(0, 20);
            }

            // ---- SPEECH ----
            function speakButton(text) {
                const id = 'speak-' + Math.random().toString(36).substr(2, 6);
                return `<button class="speak-btn" data-speak="${esc(text)}" data-speak-id="${id}" aria-label="Speak">🔊</button>`;
            }

            function handleSpeak(e) {
                const btn = e.target.closest('[data-speak]');
                if (!btn) return;
                const text = btn.dataset.speak;
                if (!text) return;
                const synth = window.speechSynthesis;
                if (!synth) return;
                // cancel any ongoing
                synth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'de-DE';
                // pick a voice: prefer Google, then non-Microsoft, then Microsoft as last resort
                const voices = synth.getVoices();
                let chosen = null;
                // 1. Google German voices (try multiple patterns)
                for (const v of voices) {
                    if (/google/i.test(v.name) && /de/i.test(v.lang)) { chosen = v; break; }
                }
                if (!chosen) {
                    // 2. any non-Microsoft German voice
                    for (const v of voices) {
                        if (/de/i.test(v.lang) && !/microsoft/i.test(v.name)) { chosen = v; break; }
                    }
                }
                if (!chosen) {
                    // 3. any German voice (including Microsoft)
                    for (const v of voices) {
                        if (/de/i.test(v.lang)) { chosen = v; break; }
                    }
                }
                if (chosen) utter.voice = chosen;
                utter.rate = 0.9;
                synth.speak(utter);
                // mark playing
                btn.textContent = '🔊';
                btn.classList.add('playing');
                utter.onend = () => { btn.textContent = '🔊';
                    btn.classList.remove('playing'); };
            }

            // ---- KEYBOARD SHORTCUTS ----
            document.addEventListener('keydown', (e) => {
                // ignore if typing in input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) {
                    if (e.key === 'Escape') {
                        document.getElementById('search-overlay').classList.remove('open');
                        document.getElementById('shortcuts-help').classList.remove('open');
                    }
                    return;
                }
                switch (e.key) {
                    case '/':
                        e.preventDefault();
                        document.getElementById('search-overlay').classList.add('open');
                        document.getElementById('search-input').focus();
                        break;
                    case 'Escape':
                        document.getElementById('search-overlay').classList.remove('open');
                        document.getElementById('shortcuts-help').classList.remove('open');
                        document.body.classList.remove('focus-mode');
                        state.focus = false;
                        store.set('focus', 'false');
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        state.focus = !state.focus;
                        store.set('focus', String(state.focus));
                        document.body.classList.toggle('focus-mode', state.focus);
                        render(state.route);
                        break;
                    case 't':
                    case 'T':
                        e.preventDefault();
                        document.getElementById('theme-toggle').click();
                        break;
                    case '?':
                        e.preventDefault();
                        document.getElementById('shortcuts-help').classList.toggle('open');
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        navigateSection(-1);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        navigateSection(1);
                        break;
                    case ' ':
                        // space to flip flashcard if on flashcard route
                        if (state.route === 'flashcards') {
                            e.preventDefault();
                            const container = document.querySelector('.flashcard-container');
                            if (container) {
                                state.flashFlipped = !state.flashFlipped;
                                container.classList.toggle('flipped', state.flashFlipped);
                            }
                        }
                        break;
                    case '1':
                    case '2':
                    case '3':
                    case '4':
                        if (state.route === 'quiz' && !state.quizDone) {
                            const idx = parseInt(e.key) - 1;
                            const btns = document.querySelectorAll('.quiz-options button:not(.disabled)');
                            if (btns[idx]) btns[idx].click();
                        }
                        break;
                }
            });

            function navigateSection(delta) {
                const all = [];
                D.nav.forEach(g => g.items.forEach(item => all.push(item.id)));
                const idx = all.indexOf(state.route);
                if (idx === -1) return;
                const next = (idx + delta + all.length) % all.length;
                render(all[next]);
            }

            // ---- RESET ----
            document.getElementById('reset-progress').onclick = () => {
                if (confirm('Reset all progress?')) {
                    state.visited = [];
                    store.set('visited', JSON.stringify([]));
                    updateProgress();
                    render(state.route);
                }
            };

            // ---- RENDER ----
            function render(route) {
                state.route = route;
                if (!state.visited.includes(route)) {
                    state.visited.push(route);
                    store.set('visited', JSON.stringify(state.visited));
                }
                // cancel speech
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                // build nav
                buildNav();
                // render content
                const container = document.getElementById('main-content');
                const renderFn = renderers[route] || renderers.home;
                container.innerHTML = renderFn();
                container.focus({ preventScroll: true });
                // update topbar
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.route === route);
                    el.setAttribute('aria-current', el.dataset.route === route ? 'page' : 'false');
                });
                // update progress
                updateProgress();
                // re-bind speech
                container.querySelectorAll('[data-speak]').forEach(el => {
                    el.onclick = handleSpeak;
                });
                // bind other dynamic events
                bindDynamicEvents(container);
                // scroll to top
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ---- BIND DYNAMIC EVENTS ----
            function bindDynamicEvents(container) {
                // Quiz
                container.querySelectorAll('.quiz-options button').forEach(btn => {
                    btn.onclick = handleQuizAnswer;
                });
                // Flashcard controls
                container.querySelectorAll('[data-flash-action]').forEach(btn => {
                    btn.onclick = handleFlashAction;
                });
                // Flashcard filter
                container.querySelectorAll('[data-flash-filter]').forEach(btn => {
                    btn.onclick = () => {
                        state.flashFilter = btn.dataset.flashFilter;
                        state.flashIndex = 0;
                        state.flashFlipped = false;
                        render('flashcards');
                    };
                });
                // Flashcard direction
                container.querySelectorAll('[data-flash-dir]').forEach(btn => {
                    btn.onclick = () => {
                        state.flashDirection = btn.dataset.flashDir;
                        state.flashIndex = 0;
                        state.flashFlipped = false;
                        render('flashcards');
                    };
                });
                // Practice
                container.querySelectorAll('[data-practice-mode]').forEach(btn => {
                    btn.onclick = () => {
                        state.practiceMode = btn.dataset.practiceMode;
                        state.practiceSelected = null;
                        state.practiceMatches = [];
                        state.practiceScore = 0;
                        state.practiceRound = 0;
                        render('practice');
                    };
                });
                container.querySelectorAll('.practice-sort .word-chip').forEach(el => {
                    el.onclick = handlePracticeSort;
                });
                container.querySelectorAll('.practice-targets .target').forEach(el => {
                    el.onclick = handlePracticeTarget;
                });
                // Builder
                container.querySelectorAll('.builder-pieces .piece').forEach(el => {
                    el.onclick = handleBuilderPiece;
                });
                container.querySelector('.builder-check button')?.addEventListener('click', handleBuilderCheck);
                // Reading mode
                container.querySelectorAll('[data-reading-mode]').forEach(btn => {
                    btn.onclick = () => {
                        state.readingMode = btn.dataset.readingMode;
                        render('reading');
                    };
                });
                // Sentence builder
                container.querySelectorAll('[data-sb-subject], [data-sb-verb], [data-sb-time]').forEach(el => {
                    el.onchange = handleSentenceBuilder;
                });
                // Flashcards keyboard fallback — click on card flips it
                container.querySelector('.flashcard-container')?.addEventListener('click', function(e) {
                    if (!e.target.closest('button')) {
                        state.flashFlipped = !state.flashFlipped;
                        this.classList.toggle('flipped', state.flashFlipped);
                    }
                });
            }

            // ---- QUIZ HANDLER ----
            let quizAnsweredState = {};

            function handleQuizAnswer(e) {
                const btn = e.currentTarget;
                if (btn.classList.contains('disabled')) return;
                const idx = parseInt(btn.dataset.quizIdx);
                const q = D.quiz[state.quizIndex];
                if (!q) return;
                const correct = idx === q.answer;
                // disable all
                const parent = btn.closest('.quiz-options');
                parent.querySelectorAll('button').forEach(b => b.classList.add('disabled'));
                // mark correct/wrong
                parent.querySelectorAll('button').forEach((b, i) => {
                    if (i === q.answer) b.classList.add('correct');
                    else if (i === idx && !correct) b.classList.add('wrong');
                });
                if (correct) state.quizScore++;
                // show explanation
                const explain = document.getElementById('quiz-explain');
                if (explain) {
                    const exp = L(q.explainAr, q.explainEn);
                    explain.innerHTML = `<strong>${L(T.ar.explanation, T.en.explanation)}:</strong> ${esc(exp)}`;
                    explain.style.display = 'block';
                }
                // next or done
                const nextBtn = document.getElementById('quiz-next');
                if (nextBtn) {
                    nextBtn.style.display = 'inline-block';
                    nextBtn.onclick = () => {
                        state.quizIndex++;
                        if (state.quizIndex >= D.quiz.length) {
                            state.quizDone = true;
                            render('quiz');
                        } else {
                            render('quiz');
                        }
                    };
                }
            }

            // ---- FLASHCARD HANDLER ----
            function handleFlashAction(e) {
                const action = e.currentTarget.dataset.flashAction;
                const items = getFlashItems();
                if (!items.length) return;
                const total = items.length;
                switch (action) {
                    case 'flip':
                        state.flashFlipped = !state.flashFlipped;
                        render('flashcards');
                        break;
                    case 'prev':
                        state.flashIndex = (state.flashIndex - 1 + total) % total;
                        state.flashFlipped = false;
                        render('flashcards');
                        break;
                    case 'next':
                        state.flashIndex = (state.flashIndex + 1) % total;
                        state.flashFlipped = false;
                        render('flashcards');
                        break;
                    case 'shuffle':
                        const shuffled = [...items];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        state.flashShuffled = shuffled;
                        state.flashShuffledIndex = 0;
                        state.flashIndex = 0;
                        state.flashFlipped = false;
                        render('flashcards');
                        break;
                }
            }

            function getFlashItems() {
                const filter = state.flashFilter;
                let items = [];
                if (filter === 'vocabulary' || filter === 'all') {
                    items = items.concat(D.vocabulary.map(v => ({ type: 'vocab', data: v, label: v.de, meaning: L(v.ar, v
                            .en) })));
                }
                if (filter === 'prefixes' || filter === 'all') {
                    items = items.concat(D.prefixes.map(p => ({ type: 'prefix', data: p, label: p.affix, meaning: L(p.ar, p
                            .en) })));
                }
                if (filter === 'suffixes' || filter === 'all') {
                    items = items.concat(D.suffixes.map(s => ({ type: 'suffix', data: s, label: s.affix, meaning: L(s.ar, s
                            .en) })));
                }
                if (state.flashShuffled.length && state.flashShuffledIndex < state.flashShuffled.length) {
                    return state.flashShuffled;
                }
                return items;
            }

            // ---- PRACTICE HANDLERS ----
            function handlePracticeSort(e) {
                const el = e.currentTarget;
                if (el.classList.contains('matched')) return;
                const word = el.dataset.word;
                const article = el.dataset.article;
                if (!word || !article) return;
                // find matching target
                const targets = document.querySelectorAll('.practice-targets .target');
                let target = null;
                for (const t of targets) {
                    if (t.dataset.article === article && !t.classList.contains('filled')) {
                        target = t;
                        break;
                    }
                }
                if (!target) return;
                target.textContent = article + ' ' + word;
                target.classList.add('filled');
                target.classList.add('correct');
                el.classList.add('matched');
                state.practiceScore++;
                document.getElementById('practice-score').textContent = `${L(T.ar.score, T.en.score)}: ${state.practiceScore}`;
                // check if all matched
                const allMatched = document.querySelectorAll('.practice-sort .word-chip:not(.matched)').length === 0;
                if (allMatched) {
                    setTimeout(() => {
                        alert(L('أحسنت!', 'Well done!'));
                        state.practiceRound++;
                        render('practice');
                    }, 300);
                }
            }

            function handlePracticeTarget(e) {
                // placeholder for future matching mode
            }

            // ---- BUILDER HANDLERS ----
            function handleBuilderPiece(e) {
                const el = e.currentTarget;
                if (el.classList.contains('used')) return;
                const value = el.dataset.value;
                if (!value) return;
                state.builderSelected.push(value);
                el.classList.add('used');
                el.classList.add('selected');
                updateBuilderDisplay();
            }

            function handleBuilderCheck() {
                const result = state.builderSelected.join('');
                const expected = document.getElementById('builder-expected')?.dataset.expected;
                const display = document.getElementById('builder-result');
                if (!display) return;
                if (result === expected) {
                    display.innerHTML = `✅ ${L('صحيح!', 'Correct!')} ${german(result)}`;
                    display.style.color = '#2a7a4a';
                    state.builderDone = true;
                } else {
                    display.innerHTML = `❌ ${L('خطأ', 'Wrong')} — ${L('النتيجة المتوقعة', 'expected')}: ${german(expected)}`;
                    display.style.color = '#b13a4a';
                }
            }

            function updateBuilderDisplay() {
                const display = document.getElementById('builder-result');
                if (display) {
                    display.textContent = state.builderSelected.join(' + ') || L('اختر أجزاء', 'Select parts');
                }
            }

            // ---- SENTENCE BUILDER ----
            function handleSentenceBuilder(e) {
                const el = e.currentTarget;
                const val = el.value;
                const key = el.dataset.sbSubject ? 'sentenceSubject' :
                    el.dataset.sbVerb ? 'sentenceVerb' :
                    el.dataset.sbTime ? 'sentenceTime' : '';
                if (key) state[key] = val;
                updateSentenceDisplay();
            }

            function updateSentenceDisplay() {
                const sb = D.sentenceBuilder;
                const sub = sb.subjects.find(s => s.id === state.sentenceSubject);
                const verb = sb.verbs.find(v => v.id === state.sentenceVerb);
                const time = sb.times.find(t => t.id === state.sentenceTime);
                if (!sub || !verb || !time) return;
                const form = verb.forms[sub.id] || verb.inf;
                const obj = verb.object ? ' jemanden' : '';
                const sent = `${time.de} ${sub.label} ${form}${obj}.`;
                const display = document.getElementById('sentence-result');
                if (display) {
                    display.innerHTML = german(sent) + `<br><span style="color:var(--text-dim);font-size:0.9rem;">${L(time.ar, time.en)} ${L(sub.ar, sub.en)} ${L(verb.ar, verb.en)}</span>`;
                }
            }

            // ============================================================
            // RENDERER FUNCTIONS
            // ============================================================

            renderers.home = function() {
                return `
                    <h1 class="section-title">📘 ${L('القصة التفاعلية', 'Interactive Story')}</h1>
                    <p class="section-sub">${L('تعلم الألمانية من خلال قصة "الحياة المزدوجة"', 'Learn German through "The Double Life" story')}</p>
                    <div class="card-grid">
                        <div class="card"><h3>📖 ${L('القصة', 'The Story')}</h3><p>${L('قصة مثيرة عن السر والخيانة والحقيقة', 'A dramatic story about secrets, betrayal, and truth')}</p><button data-route="reading" class="nav-item" style="margin-top:0.5rem;background:var(--brand);color:#fff;padding:0.4rem 1.2rem;border-radius:20px;">${L('اقرأ', 'Read')}</button></div>
                        <div class="card"><h3>📝 ${L('المفردات', 'Vocabulary')}</h3><p>${L('أكثر من 15 كلمة من القصة مع أمثلة', '15+ words from the story with examples')}</p><button data-route="vocabulary" class="nav-item" style="margin-top:0.5rem;background:var(--brand);color:#fff;padding:0.4rem 1.2rem;border-radius:20px;">${L('استكشف', 'Explore')}</button></div>
                        <div class="card"><h3>🎭 ${L('الحوارات', 'Dialogues')}</h3><p>${L('محادثات من القصة مع ترجمة', 'Conversations from the story with translation')}</p><button data-route="dialogues" class="nav-item" style="margin-top:0.5rem;background:var(--brand);color:#fff;padding:0.4rem 1.2rem;border-radius:20px;">${L('استمع', 'Listen')}</button></div>

                for (let i = shuffled.length - 1; i > 0; i--) {

                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
